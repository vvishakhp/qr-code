<!DOCTYPE html>
<html lang="en">
  <head>
    <title>QRCode.js – SVG shapes</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
    <script type="text/javascript" src="qrcode.js"></script>
    <style>
      body { font-family: system-ui, sans-serif; margin: 24px; background: #f4f1ea; color: #1c1916; }
      #qrcode { width: 256px; height: 256px; background: #fff; border-radius: 12px; padding: 12px; }
    </style>
  </head>
  <body>
    <p>SVG renderer with round modules and circular markers</p>
    <div id="qrcode"></div>
    <script type="text/javascript">
      new QRCode(document.getElementById("qrcode"), {
        text: "https://github.com/davidshimjs/qrcodejs",
        width: 256,
        height: 256,
        useSVG: true,
        colorDark: "#1c1916",
        colorLight: "#ffffff",
        moduleShape: "dots",
        markerShape: "circle",
        markerInnerShape: "circle",
        alignmentShape: "circle"
      });
    </script>
  </body>
</html>
